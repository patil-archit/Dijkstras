<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Digital Twin</title>
    
    <!-- React & ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration (Thonik Brutalist Theme) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              thonik: {
                black: '#000000',
                white: '#ffffff',
                accent: '#ff3300',
                accent2: '#0044ff',
              }
            },
            fontFamily: {
              sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
              display: ['Impact', 'Arial Black', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'marquee': 'marquee 20s linear infinite',
            },
            keyframes: {
              'marquee': {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          }
        }
      }
    </script>

    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-thonik-white text-thonik-black overflow-x-hidden;
          font-size: 1.25rem;
          line-height: 1.1;
        }

        h1, h2, h3, h4, h5, h6 {
          @apply font-display uppercase tracking-tighter;
          line-height: 0.9;
        }
      }

      @layer components {
        .btn {
          @apply px-6 py-3 font-display uppercase text-xl border-4 border-thonik-black bg-thonik-white text-thonik-black transition-all duration-100 flex items-center justify-center gap-4 relative overflow-hidden cursor-pointer;
        }
        .btn:hover {
          @apply bg-thonik-black text-thonik-white;
        }
        .btn-primary {
          @apply bg-thonik-accent text-thonik-black border-thonik-black;
        }
        .btn-primary:hover {
          @apply bg-thonik-black text-thonik-accent;
        }
        .input-base {
          @apply w-full px-4 py-3 bg-thonik-white text-thonik-black border-4 border-thonik-black font-sans font-bold text-lg focus:bg-thonik-accent focus:text-thonik-black transition-colors duration-100 rounded-none outline-none;
        }
        .input {
          @apply input-base;
        }
        .select-input {
          @apply input-base appearance-none cursor-pointer;
          background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
          background-repeat: no-repeat;
          background-position: right 1rem top 50%;
          background-size: 1rem auto;
        }
        .label {
          @apply block text-xl font-display uppercase text-thonik-black mb-1;
        }
        .brutalist-panel {
          @apply border-4 border-thonik-black bg-thonik-white relative;
        }
        .brutalist-shadow {
          box-shadow: 12px 12px 0px 0px rgba(0,0,0,1);
        }
        .brutalist-shadow-hover {
          transition: transform 0.1s, box-shadow 0.1s;
        }
        .brutalist-shadow-hover:hover {
          transform: translate(-4px, -4px);
          box-shadow: 16px 16px 0px 0px rgba(0,0,0,1);
        }
      }

      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
        display: flex;
        width: 100vw;
        border-top: 4px solid black;
        border-bottom: 4px solid black;
        background: white;
        padding: 1rem 0;
      }
      .marquee-content {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 15s linear infinite;
        font-family: 'Impact', 'Arial Black', sans-serif;
        text-transform: uppercase;
        font-size: 4rem;
        line-height: 1;
      }
      .zebra-bg {
        background-image: repeating-linear-gradient(-45deg, #000, #000 20px, #fff 20px, #fff 40px);
      }
    </style>
  </head>
  <body class="bg-thonik-white min-h-screen flex flex-col items-center">
    
    <!-- React Root -->
    <div id="root" class="w-full"></div>

    <!-- Hidden Unity Elements (To be injected by React) -->
    <div id="unity-wrapper" style="display: none;" class="w-full h-full relative">
      <canvas id="unity-canvas" class="w-full h-full block" tabindex="-1"></canvas>
      
      <!-- Custom Brutalist Loading Bar -->
      <div id="unity-loading-bar" class="absolute inset-0 flex items-center justify-center bg-thonik-white z-50">
        <div class="text-center">
          <h2 class="mb-6 text-4xl text-thonik-black">LOADING SIMULATION...</h2>
          <div class="w-80 h-10 border-4 border-thonik-black p-1 bg-thonik-white">
            <div id="unity-progress-bar-full" class="h-full bg-thonik-accent" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const nodeIds = ["A1", "A2", "A3", "B1", "B2", "B3", "C1", "C2", "C3"];
      const allEdges = [
        "A1-A2", "A2-A1", "A2-A3", "A3-A2",
        "B1-B2", "B2-B1", "B2-B3", "B3-B2",
        "C1-C2", "C2-C1", "C2-C3", "C3-C2",
        "A1-B1", "B1-A1", "B1-C1", "C1-B1",
        "A2-B2", "B2-A2", "B2-C2", "C2-B2",
        "A3-B3", "B3-A3", "B3-C3", "C3-B3"
      ];

      function App() {
        const containerRef = useRef(null);

        // Form State
        const [road, setRoad] = useState(allEdges[0]);
        const [weight, setWeight] = useState("50");
        const [startNode, setStartNode] = useState(nodeIds[0]);
        const [endNode, setEndNode] = useState(nodeIds[nodeIds.length - 1]);

        useEffect(() => {
          const unityWrapper = document.getElementById("unity-wrapper");
          if (unityWrapper && containerRef.current) {
            // Unhide and mount the Unity Canvas inside the React component
            unityWrapper.style.display = "block";
            containerRef.current.appendChild(unityWrapper);
            
            // Unity Configuration
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/WebBuild.loader.js";
            var config = {
              dataUrl: buildUrl + "/WebBuild.data",
              frameworkUrl: buildUrl + "/WebBuild.framework.js",
              codeUrl: buildUrl + "/WebBuild.wasm",
              streamingAssetsUrl: "StreamingAssets",
              companyName: "DefaultCompany",
              productName: "Digital Twin",
              productVersion: "0.1",
            };

            // Load Unity WebGL Engine
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
              createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                window.unityInstance = unityInstance;
              }).catch((message) => {
                alert(message);
              });
            };
            document.body.appendChild(script);
          }
        }, []);

        const handleFullscreen = () => {
          if (window.unityInstance) {
            window.unityInstance.SetFullscreen(1);
          }
        };

        const updateWeight = () => {
          if (window.unityInstance) {
            window.unityInstance.SendMessage("WebBridge", "SetWeight", `${road}:${weight}`);
            console.log(`Sent to Unity: SetWeight ${road}:${weight}`);
          }
        };

        const startSimulation = () => {
          if (window.unityInstance) {
            window.unityInstance.SendMessage("WebBridge", "RunSimulation", `${startNode}:${endNode}`);
            console.log(`Sent to Unity: RunSimulation ${startNode}:${endNode}`);
          }
        };

        return (
          <div className="flex flex-col items-center w-full pb-20 zebra-bg min-h-screen">
            
            {/* Brutalist Marquee Header */}
            <div className="marquee-container mb-8 bg-thonik-white">
              <div className="marquee-content text-thonik-accent">
                DIJKSTRA'S SIMULATION • DIGITAL TWIN • DIJKSTRA'S SIMULATION • DIGITAL TWIN • DIJKSTRA'S SIMULATION •
              </div>
            </div>

            {/* Main Content Area */}
            <div className="w-full max-w-[90rem] px-4 flex flex-col items-center">
              
              {/* Title Panel */}
              <div className="brutalist-panel brutalist-shadow p-4 mb-8 bg-thonik-white w-full text-center">
                <h1 className="text-5xl md:text-7xl text-thonik-black m-0">DIJKSTRA'S SIMULATION</h1>
              </div>

              {/* Split Screen Layout */}
              <div className="flex flex-col lg:flex-row w-full gap-8 mb-8">
                
                {/* LEFT PANEL: REACT DASHBOARD */}
                <div className="brutalist-panel brutalist-shadow w-full lg:w-1/3 p-6 flex flex-col bg-thonik-white">
                  <h2 className="text-4xl text-thonik-black mb-8 border-b-4 border-thonik-black pb-4">DASHBOARD</h2>
                  
                  {/* Traffic Control */}
                  <div className="mb-10">
                    <h3 className="text-2xl text-thonik-accent mb-4">Traffic Control</h3>
                    <label className="label">Select Road</label>
                    <select className="select-input mb-4" value={road} onChange={e => setRoad(e.target.value)}>
                      {allEdges.map(e => <option key={e} value={e}>{e}</option>)}
                    </select>
                    
                    <label className="label">Traffic Weight</label>
                    <input type="number" className="input mb-6" value={weight} onChange={e => setWeight(e.target.value)} />
                    
                    <button className="btn w-full brutalist-shadow brutalist-shadow-hover" onClick={updateWeight}>
                      UPDATE WEIGHT
                    </button>
                  </div>

                  {/* Vehicle Routing */}
                  <div>
                    <h3 className="text-2xl text-thonik-accent mb-4">Vehicle Routing</h3>
                    <label className="label">Start Node</label>
                    <select className="select-input mb-4" value={startNode} onChange={e => setStartNode(e.target.value)}>
                      {nodeIds.map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                    
                    <label className="label">End Node</label>
                    <select className="select-input mb-6" value={endNode} onChange={e => setEndNode(e.target.value)}>
                      {nodeIds.map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                    
                    <button className="btn btn-primary w-full brutalist-shadow brutalist-shadow-hover" onClick={startSimulation}>
                      START SIMULATION
                    </button>
                  </div>
                </div>

                {/* RIGHT PANEL: UNITY FRAME */}
                <div 
                  className="brutalist-panel brutalist-shadow w-full lg:w-2/3 aspect-video bg-thonik-black relative overflow-hidden flex-shrink-0"
                  ref={containerRef}
                >
                </div>

              </div>

              {/* Footer Buttons */}
              <div className="flex gap-6 w-full justify-center">
                <button 
                  className="btn bg-thonik-white brutalist-shadow brutalist-shadow-hover"
                  onClick={handleFullscreen}
                >
                  ENTER FULLSCREEN
                </button>
              </div>

            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
